<!--
  BLOCO DE <head> PARA index.html — Fase 1, itens 4 (SEO) e 2 (favicon local).

  Como aplicar, depois que o push do AI Studio trouxer o index.html:
    1. Manter as tags <title> e <meta name="description"> que já existem (estão boas).
    2. Remover <meta name="keywords"> — ignorado pelos buscadores.
    3. Trocar o href absoluto do favicon (hoje https://curtatche.com.br/favicon.png)
       pelo caminho relativo /favicon.png, já que o arquivo passa a ser servido
       pelo próprio domínio.
    4. Colar o bloco abaixo antes do fechamento do </head>, preservando as tags
       <script type="module"> e <link rel="stylesheet"> que o Vite injeta.

  O telefone e as redes vêm do que já está no rodapé do site. Falta preencher:
  endereço e CNPJ (ver "Fora do escopo" no plano) — enquanto não vierem, as
  linhas correspondentes ficam comentadas para não publicar dado inventado.
-->
